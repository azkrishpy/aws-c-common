# Level 1 validation for the changelog tooling, self-contained in this repo.
#
# Uses .github/scripts/changelog.py directly -- no aws-crt-builder checkout, no
# AWS credentials, no deploy key. Nothing is ever committed or pushed: the
# release simulation copies .changes/ to a scratch directory first, so every
# run leaves this repo byte-identical.
#
# Once this passes, the same script moves back behind the Pre-merge checks job.

name: Changelog selftest

on:
  push:
    branches: [changelog-selftest]
  workflow_dispatch:
    inputs:

permissions:
  contents: read

env:
  CL: ${{ github.workspace }}/.github/scripts/changelog.py

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pytest
      - name: Unit tests
        run: python3 -m pytest .github/changelog-tests -q

  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Behavioural scenarios, asserted on rc and reason
        run: bash .github/scripts/changelog-scenarios.sh

  mutation-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pytest
      - name: Every guard must have a check that dies without it
        run: |
          set -uo pipefail +e
          # A green suite proves nothing unless removing a guard turns it red.
          MODULES=(.github/scripts/fragments.py .github/scripts/render.py
                   .github/scripts/release.py .github/scripts/check.py
                   .github/scripts/changelog.py)
          mkdir -p /tmp/pristine
          cp "${MODULES[@]}" /tmp/pristine/
          survived=0; killed=0
          restore() { for m in "${MODULES[@]}"; do cp "/tmp/pristine/$(basename "$m")" "$m"; done; }

          mutate() {
            local label="$1" old="$2" new="$3" target=""
            restore
            # Which module holds the guard is derived, so moving a function
            # between modules cannot silently stop a mutation from applying.
            for m in "${MODULES[@]}"; do
              if grep -qF -- "$old" "$m"; then target="$m"; break; fi
            done
            if [[ -z "$target" ]]; then
              echo "BROKEN    ${label}  <- target absent from every module"
              survived=$((survived+1)); return
            fi
            if ! python3 .github/scripts/mutate.py "$target" "$old" "$new"; then
              echo "BROKEN    ${label}  <- target absent, fix the mutation"
              survived=$((survived+1)); return
            fi
            if cmp -s "/tmp/pristine/$(basename "$target")" "$target"; then
              echo "BROKEN    ${label}  <- mutation changed nothing"
              survived=$((survived+1)); return
            fi
            # A mutant that dies of SyntaxError proves nothing -- the suite would
            # fail on the parse, not on the guard. An AssertionError is different:
            # that is the module's own invariant catching the mutation, so it counts.
            err="$(python3 -c "import sys; sys.path.insert(0,'.github/scripts'); import changelog" 2>&1 >/dev/null || true)"
            if grep -qE "SyntaxError|IndentationError" <<< "$err"; then
              echo "BROKEN    ${label}  <- mutant does not parse, fix the mutation"
              survived=$((survived+1)); return
            fi
            if python3 -m pytest .github/changelog-tests -q >/tmp/mut.log 2>&1 \
               && bash .github/scripts/changelog-scenarios.sh >>/tmp/mut.log 2>&1; then
              echo "SURVIVED  ${label}  <- nothing covers this"
              survived=$((survived+1))
            else
              echo "killed    ${label}"
              killed=$((killed+1))
            fi
          }

          mutate "a placeholder pr number is accepted" 'elif pr <= 0:' 'elif False:'
          mutate "an unexpected field is ignored" 'if extra:' 'if False:'
          mutate "a whole type section stops rendering" \
            'for pr_type, cat in CATEGORY.items():' 'for pr_type, cat in list(CATEGORY.items())[:2]:'
          mutate "a revert needs no notes" 'and not notes.strip():' 'and False:'
          mutate "seed accepts pr 0" 'if args.pr <= 0:' 'if False:'
          mutate "the title convention is not enforced" 'bad-title' 'ok'
          mutate "a type mismatch is tolerated" 'type-mismatch' 'ok'
          mutate "a stray fragment is tolerated" 'stray-fragment' 'ok'
          mutate "a modified fragment is tolerated" 'modified-fragment' 'ok'
          mutate "a fragment named for another pull request is loaded" \
            'if path.stem.isdigit() and data.get("pr") != int(path.stem):' 'if False:'
          mutate "an invalid fragment is released and lost" \
            'if len(fragments) != len(on_disk):' 'if False:'
          mutate "a malformed date is accepted" 'if not ISO_DATE_RE.match(args.date):' 'if False:'
          mutate "the abi label stops deciding the breaking section" \
            'if f["pr"] in minor_prs and f["type"] in CATEGORY]' 'if False]'
          mutate "a labelled chore is rendered as breaking" \
            'and f["type"] in CATEGORY]' ']'
          mutate "a release rewrites what is already published" \
            'head, _, tail = text.partition(END)' 'head, tail = skeleton(""), ""'
          mutate "a refresh drops everything below the region" \
            '_, _, tail = rest.partition(END)' 'tail = ""'
          mutate "a closed minor line is never archived" \
            'if section and closing and opening and closing != opening:' 'if False:'
          mutate "an empty release still archives the old line" \
            'if section and closing' 'if closing'
          mutate "an existing archive is silently overwritten" \
            'if target.exists() and target.read_text() != archive:' 'if False:'
          mutate "the line is read from prose instead of the heading" \
            'VERSION_RE.match(text)' 'VERSION_RE.search(text)'
          mutate "a marker can be smuggled into an entry" 'if isinstance(data.get(field), str)' 'if False'
          mutate "minor-prs is not checked for numbers" \
            'if not all(p.isdigit() for p in labelled):' 'if False:'
          mutate "an archived link is left pointing one level too high" \
            '.replace("](../../pull/", "](../../../pull/")' '.replace("](../../pull/", "](../../pull/")'
          mutate "the archived lines are listed oldest first" 'reverse=True,' 'reverse=False,'
          mutate "the list of archived lines is never written" \
            'if listing else ""' 'if False else ""'
          mutate "a chore renders as an entry" \
            'if f["type"] == pr_type and f["pr"] not in minor_prs]' 'if f["pr"] not in minor_prs]'

          restore
          echo
          echo "mutation-check: ${killed} killed, ${survived} survived"
          echo "mutation-check: ${killed} killed, ${survived} survived" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          [[ "$survived" -eq 0 ]] || exit 1
          exit 0

  size-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: What .changes/ costs over a realistic release history
        run: python3 .github/scripts/rollup-scale.py

  docs-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: awslabs/aws-crt-builder
          ref: cl/7-workflows
          path: .crt-builder
      - name: Replay merges onto a stand-in docs branch, in a scratch repo
        run: |
          set -euo pipefail
          # Runs aws-crt-builder's changelog-replay.sh -- the same file its
          # reusable workflows run -- with test-main/test-docs standing in for
          # main/docs. No real branch, no remote, no deploy key. PUSH=false keeps
          # it local.
          REPLAY="${GITHUB_WORKSPACE}/.crt-builder/.github/workflows/changelog-replay.sh"
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q -b test-main .
          git config user.name t; git config user.email t@t
          mkdir -p .changes/preview
          cp "${GITHUB_WORKSPACE}/.changes/README.md" .changes/README.md
          git add -A && git commit -q -m "seed a changes tree with no releases"

          export CHANGELOG_PY="${GITHUB_WORKSPACE}/.github/scripts/changelog.py"
          export DEFAULT_BRANCH=test-main DOCS_BRANCH=test-docs PUSH=false

          # --- merge 1: an author adds a fragment
          printf '{"pr":40,"type":"feat","summary":"Add a widget","notes":""}\n' \
            > .changes/preview/40.json
          git add -A && git commit -q -m "feat: add a widget (#40)"
          TRIGGER_SHA="$(git rev-parse HEAD)" bash "$REPLAY"

          git checkout -q test-docs
          grep -qF "Add a widget" CHANGELOG.md
          grep -qF "## [Unreleased]" CHANGELOG.md
          echo "merge 1: docs CHANGELOG.md carries the unreleased entry"

          # The release branch must never receive a bot commit.
          git checkout -q test-main
          [[ ! -f CHANGELOG.md ]] || { echo "release branch gained CHANGELOG.md" >&2; exit 1; }
          [[ "$(git rev-list --count test-main)" == "2" ]]
          echo "merge 1: release branch untouched"

          # --- merge 2: a release rolls the fragment up
          python3 "$CHANGELOG_PY" rollup --version 1.1.0 --date 2026-11-01 \
            --changes-dir .changes --changelog CHANGELOG.md
          git add -A && git commit -q -m "chore(release): 1.1.0"
          TRIGGER_SHA="$(git rev-parse HEAD)" bash "$REPLAY"

          git checkout -q test-docs
          grep -qF "## [1.1.0]" CHANGELOG.md
          grep -qF "Add a widget" CHANGELOG.md
          grep -qF "## [Unreleased]" CHANGELOG.md
          echo "merge 2: docs shows the release and keeps an unreleased region"

          # --- idempotence: replaying the same sha again changes nothing
          BEFORE="$(git rev-parse test-docs)"
          git checkout -q test-main
          TRIGGER_SHA="$(git rev-parse HEAD)" bash "$REPLAY" || true
          git checkout -q test-docs
          echo "docs before=${BEFORE} after=$(git rev-parse test-docs)"
          [[ "$(git rev-parse test-docs)" == "$BEFORE" ]]

          # --- merge 3: a real merge commit, as a non-squash branch produces
          git checkout -q test-main
          git checkout -q -b side
          # The rollup emptied preview/, and git does not track an empty dir.
          mkdir -p .changes/preview
          printf '{"pr":42,"type":"fix","summary":"Fix a leak","notes":""}\n' \
            > .changes/preview/42.json
          git add -A && git commit -q -m "fix: fix a leak (#42)"
          git checkout -q test-main
          git merge -q --no-ff side -m "Merge a pull request"
          TRIGGER_SHA="$(git rev-parse HEAD)" bash "$REPLAY"

          git checkout -q test-docs
          grep -qF "Fix a leak" CHANGELOG.md
          echo "merge 3: a merge commit replays against its first parent"

          { echo "### docs branch CHANGELOG.md after the replay"; echo '```markdown';
            cat CHANGELOG.md; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: The docs branch defaults when no override is set
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q .; git config user.name t; git config user.email t@t
          git commit -q --allow-empty -m base
          git commit -q --allow-empty -m second
          # No DOCS_BRANCH in the environment: the script must resolve `docs`,
          # which it names as it replays onto it.
          out="$(TRIGGER_SHA="$(git rev-parse HEAD)" \
                 CHANGELOG_PY="${GITHUB_WORKSPACE}/.github/scripts/changelog.py" \
                 PUSH=false bash "${GITHUB_WORKSPACE}/.crt-builder/.github/workflows/changelog-replay.sh" 2>&1)"
          echo "$out"
          [[ "$out" == *"onto docs"* ]]

  render-real-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render this repo's real .changes/ tree
        run: |
          set -euo pipefail
          # Render to a scratch path so the checked-in CHANGELOG.md is untouched.
          WORK="$(mktemp -d)"; cp -r .changes "${WORK}/.changes"
          python3 "${CL}" render --changes-dir "${WORK}/.changes" \
                                 --changelog "${WORK}/CHANGELOG.md"
          # The render must be byte-identical on a second run.
          cp "${WORK}/CHANGELOG.md" "${WORK}/first.md"
          python3 "${CL}" render --changes-dir "${WORK}/.changes" \
                                 --changelog "${WORK}/CHANGELOG.md"
          diff -u "${WORK}/first.md" "${WORK}/CHANGELOG.md"
          # Nothing is released yet, so every in-flight fragment must appear.
          for want in "## [Unreleased]" "([#1283]" "([#1285]"; do
            grep -qF "$want" "${WORK}/CHANGELOG.md" || { echo "MISSING: $want" >&2; exit 1; }
          done
          OUT="${RUNNER_TEMP:-/tmp}/rendered-CHANGELOG.md"
          cp "${WORK}/CHANGELOG.md" "$OUT"
          { echo "### Rendered from the real tree"; echo '```markdown';
            cat "$OUT"; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "--- repo is unchanged:"; git status --porcelain -- .changes CHANGELOG.md
          [[ -z "$(git status --porcelain -- .changes CHANGELOG.md)" ]]
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-changelog
          path: ${{ runner.temp }}/rendered-CHANGELOG.md

  simulate-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Simulate a patch then a minor rollup, on a copy
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"; cp -r .changes "${WORK}/.changes"
          cd "${WORK}"
          echo "=== starting point"
          find .changes -type f | sort
          cp "${GITHUB_WORKSPACE}/CHANGELOG.md" CHANGELOG.md

          # --- patch: 1.0.2 releases what is in preview/
          echo "=== patch 1.0.2"
          python3 "${CL}" rollup --version 1.0.2 --date 2026-09-01 \
            --changes-dir .changes --changelog CHANGELOG.md --minor-prs 1283
          grep -qF "## [1.0.2]" CHANGELOG.md
          # The label the caller passed decides the section; nothing is stored.
          grep -qF "### Possible Breaking Changes" CHANGELOG.md
          [[ -z "$(ls -A .changes/preview)" ]] || { echo "preview not drained" >&2; exit 1; }
          # Hand-written history below the insert point is untouched.
          grep -qF "Official release of 1.0.0." CHANGELOG.md
          cp CHANGELOG.md /tmp/after-patch.md

          # --- a second patch sits above the first, in the same line
          printf '{"pr":1288,"type":"fix","summary":"Handle EINTR","notes":""}\n' \
            > .changes/preview/1288.json
          echo "=== patch 1.0.3"
          python3 "${CL}" rollup --version 1.0.3 --date 2026-09-05 \
            --changes-dir .changes --changelog CHANGELOG.md
          NEW_AT=$(grep -n '^## \[1.0.3\]' CHANGELOG.md | cut -d: -f1)
          OLD_AT=$(grep -n '^## \[1.0.2\]' CHANGELOG.md | cut -d: -f1)
          [[ "$NEW_AT" -lt "$OLD_AT" ]] || { echo "release order wrong" >&2; exit 1; }
          # A blank line above the older one, or the sections run together.
          [[ -z "$(sed -n "$((OLD_AT-1))p" CHANGELOG.md)" ]] \
            || { echo "sections run together" >&2; exit 1; }
          [[ ! -f .changes/1.0.x.md ]] || { echo "a patch archived" >&2; exit 1; }
          echo "newest patch on top, nothing archived"

          # --- a new minor line closes the old one
          printf '{"pr":1290,"type":"feat","summary":"New retry strategy","notes":""}\n' \
            > .changes/preview/1290.json
          echo "=== release 1.1.0"
          python3 "${CL}" rollup --version 1.1.0 --date 2026-10-01 \
            --changes-dir .changes --changelog CHANGELOG.md
          [[ -f .changes/1.0.x.md ]] || { echo "no archive written" >&2; exit 1; }
          grep -qF "## [1.0.3]" .changes/1.0.x.md
          grep -qF "## [1.0.2]" .changes/1.0.x.md
          # The pre-adoption section went with the line it belongs to.
          grep -qF "Official release of 1.0.0." .changes/1.0.x.md
          ! grep -qF "## [1.0.2]" CHANGELOG.md
          grep -qF -- "- [1.0.x](.changes/1.0.x.md)" CHANGELOG.md
          # One directory deeper, so every link in the archive gained a level.
          grep -qF "(../../../pull/1283)" .changes/1.0.x.md
          grep -qF "(../../pull/1290)" CHANGELOG.md
          echo "1.0.x archived, root carries only 1.1.x and links out"

          # --- a re-run of the release job must not add a second section
          echo "=== retry"
          python3 "${CL}" rollup --version 1.1.0 --date 2026-10-01 \
            --changes-dir .changes --changelog CHANGELOG.md
          [[ "$(grep -c '^## \[1.1.0\]' CHANGELOG.md)" == "1" ]] \
            || { echo "retry duplicated the section" >&2; exit 1; }
          [[ "$(ls .changes/*.x.md | wc -l)" == "1" ]] \
            || { echo "retry archived again" >&2; exit 1; }
          echo "retry changed nothing"

          # --- an invalid fragment stops a release rather than losing the entry
          echo "=== invalid fragment"
          printf '{ not json\n' > .changes/preview/1291.json
          ! python3 "${CL}" rollup --version 1.1.1 --date 2026-10-02 \
              --changes-dir .changes --changelog CHANGELOG.md
          [[ -f .changes/preview/1291.json ]] \
            || { echo "the invalid fragment was deleted" >&2; exit 1; }
          rm .changes/preview/1291.json
          echo "refused, and the fragment is still on disk"

          SIM="${RUNNER_TEMP:-/tmp}/sim"
          mkdir -p "$SIM"
          cp /tmp/after-patch.md "$SIM/after-patch-1.0.2.md"
          cp CHANGELOG.md "$SIM/after-release-1.1.0.md"
          cp .changes/1.0.x.md "$SIM/archived-1.0.x.md"
          find .changes -type f | sort > "$SIM/final-tree.txt"
          { echo "### After the simulated releases"; echo '```markdown';
            cat CHANGELOG.md; echo '```';
            echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: This repo must be untouched
        run: |
          set -euo pipefail
          git status --porcelain -- .changes CHANGELOG.md
          [[ -z "$(git status --porcelain -- .changes CHANGELOG.md)" ]]
          echo "no release was made; .changes/ and CHANGELOG.md are unchanged"
      - uses: actions/upload-artifact@v4
        with:
          name: release-simulation
          path: ${{ runner.temp }}/sim/
